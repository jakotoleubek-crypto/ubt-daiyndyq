<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ҰБТ-ға дайындық</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#14213d;--mut:#64748b;--line:#d9e2ee;--blue:#1d4ed8;--on:#fff;--blue-s:#e6eeff;--ok:#15803d;--ok-s:#e6f5ec;--bad:#b91c1c;--bad-s:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#17233b;--ink:#e6ecf5;--mut:#94a3b8;--line:#2a3a57;--blue:#7aa7ff;--on:#0b1220;--blue-s:#1d2f55;--ok:#4ade80;--ok-s:#12301f;--bad:#f87171;--bad-s:#3a1a1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#17233b;--ink:#e6ecf5;--mut:#94a3b8;--line:#2a3a57;--blue:#7aa7ff;--on:#0b1220;--blue-s:#1d2f55;--ok:#4ade80;--ok-s:#12301f;--bad:#f87171;--bad-s:#3a1a1f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'Noto Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.w{max-width:920px;margin:0 auto;padding:20px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}
.brand{font:700 1rem 'Noto Sans',sans-serif;color:var(--blue);background:none;border:0;padding:0;cursor:pointer}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--blue-s);color:var(--blue);padding:6px 12px;border-radius:9px}
h1{font-size:clamp(1.9rem,5.5vw,2.9rem);line-height:1.12;letter-spacing:-.02em;margin:0 0 12px}
h2{font-size:1.25rem;line-height:1.4;margin:0 0 18px}
.lead{color:var(--mut);max-width:56ch;margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sc{display:flex;flex-direction:column;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;color:inherit;font:inherit;cursor:pointer;transition:border-color .15s}
.sc:hover{border-color:var(--blue)}
.sc b{font-size:1.08rem}
.ic{width:48px;height:48px;border-radius:12px;background:var(--blue-s);color:var(--blue);display:grid;place-items:center}
.ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.go{align-self:flex-start;background:var(--blue);color:var(--on);border-radius:9px;padding:8px 14px;font-weight:500;font-size:.9rem}
.btn{font:500 .95rem 'Noto Sans',sans-serif;background:var(--blue);color:var(--on);border:1px solid var(--blue);border-radius:10px;padding:11px 18px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--blue)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:.85rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.row.sp{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
textarea{width:100%;min-height:300px;resize:vertical;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.err{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--bad-s);color:var(--bad);font-weight:500}
.note{margin-top:12px;color:var(--ok);font-weight:500}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.n{min-width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 .9rem 'Noto Sans',sans-serif;cursor:pointer}
.n.done{background:var(--blue-s);color:var(--blue);border-color:var(--blue-s)}
.n.cur{border:2px solid var(--blue);color:var(--blue)}
.cnt{margin:0 0 6px;color:var(--mut);font-size:.88rem}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-top:8px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt:hover{border-color:var(--blue)}
.opt.on{border-color:var(--blue);background:var(--blue-s)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
.k{flex:none;width:28px;height:28px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--mut)}
.opt.on .k{background:var(--blue);color:var(--on)}
.res{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.pct{font-size:clamp(3rem,12vw,4.6rem);font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--blue)}
.bar{height:10px;border-radius:6px;background:var(--blue-s);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;background:var(--blue)}
.stat{margin:0;color:var(--mut)}
.stat b{display:block;color:var(--ink);font-size:1.5rem}
.rv{margin-top:14px;border-left:5px solid var(--line)}
.rv.ok{border-left-color:var(--ok)}
.rv.bad{border-left-color:var(--bad)}
.st{font-weight:700;font-size:.88rem}
.ok .st{color:var(--ok)}.bad .st{color:var(--bad)}
.ro{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 12px;margin-top:6px;border-radius:9px;border:1px solid var(--line)}
.ro.c{background:var(--ok-s);border-color:var(--ok)}
.ro.w{background:var(--bad-s);border-color:var(--bad)}
.tag{flex:none;font-size:.78rem;font-weight:700}
.ro.c .tag{color:var(--ok)}.ro.w .tag{color:var(--bad)}
.hint{color:var(--mut);font-size:.9rem;margin:0 0 12px}
input[type=text]{width:100%;margin-bottom:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit}
.mut{color:var(--mut)}.sync{font-size:.8rem;color:var(--mut)}
.tr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.tr:first-child{border-top:0}.acts{display:flex;gap:8px;flex:none}
.cn{font-size:.85rem;color:var(--mut)}
.board{margin-top:24px}
.board-item{padding:10px 0;border-top:1px solid var(--line)}
.board-item:first-child{border-top:0}
.board-item small{display:block;color:var(--mut)}
h3{margin:0 0 4px;font-size:1.05rem}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(max-width:520px){.card{padding:16px}.row .btn{flex:1}}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const app=document.getElementById('app'),L='ABCDEFGHIJKLMNOP';
const FIREBASE_CONFIG={apiKey:'',authDomain:'',projectId:'',appId:''};
const FIREBASE_CONFIGURED=Object.values(FIREBASE_CONFIG).every(v=>v&&v.trim());
const svg=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const SUBJ=[
{id:'kh',name:'Қазақстан тарихы',ic:svg('<path d="M3 20h18M5 20V10M9.7 20V10M14.3 20V10M19 20V10M3 10l9-6 9 6"/>')},
{id:'dh',name:'Дүниежүзі тарихы',ic:svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>')},
{id:'ms',name:'Математикалық сауаттылық',ic:svg('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>')},
{id:'m',name:'Математика',ic:svg('<path d="M18 5H6l6 7-6 7h12"/>')},
{id:'inf',name:'Информатика',ic:svg('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M8 9l-2 2 2 2M16 9l2 2-2 2"/>')},
{id:'en',name:'Ағылшын тілі',ic:svg('<path d="M4 5h16v11H9l-5 4z"/><path d="M9 12l3-5 3 5M10 10.8h4"/>')}
];
const SAMPLE=[
{question:'Қазақстан Республикасы тәуелсіздігін қай жылы жариялады?',options:['1986','1991','1993','2000'],correct:[1]},
{question:'Төмендегілердің қайсысы жай сан? (Бірнеше жауап таңдаңыз)',options:['2','4','7','9'],correct:[0,2]},
{question:'Қазақстанның астанасы қай қала?',options:['Алматы','Астана','Шымкент','Қарағанды'],correct:[1]}
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const same=(a,b)=>a.length===b.length&&[...a].sort().every((x,i)=>x===b[i]);
const lget=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=lget('ubt:session')||{view:'home'},TESTS=lget('ubt:tests')||[],DB=null,UID=null,ready=false,loaded=false,warned=false,armed=null,cloudError='',SHARED_RESULTS=[],RESULTS_ERROR='',publishing=false;
const sub=()=>SUBJ.find(s=>s.id===S.sid);
const cur=()=>TESTS.find(t=>t.id===S.tid);
const QS=()=>cur().qs;
const $=q=>document.querySelector(q);
function save(){S.ts=Date.now();lset('ubt:session',S)}
if(S.view!=='home'&&!sub())S={view:'home'};
const elapsed=()=>S.view==='result'?S.time:Math.floor((Date.now()-S.t0)/1000);
const score=()=>QS().reduce((n,q,i)=>n+(same(S.ans[i]||[],q.correct)?1:0),0);
const err=m=>`<div class="err">${esc(m)}</div>`;
function validTest(t){
  return t&&typeof t.ownerUid==='string'&&typeof t.title==='string'&&t.title.length>0&&t.title.length<=120&&SUBJ.some(s=>s.id===t.sid)&&Number.isSafeInteger(t.ts)&&Array.isArray(t.qs)&&t.qs.length>0&&t.qs.length<=300&&t.qs.every(q=>q&&typeof q.question==='string'&&q.question.trim().length>0&&q.question.length<=1000&&Array.isArray(q.options)&&q.options.length>=2&&q.options.length<=L.length&&q.options.every(o=>typeof o==='string'&&o.length<=500)&&Array.isArray(q.correct)&&q.correct.length>0&&q.correct.length<=q.options.length&&new Set(q.correct).size===q.correct.length&&q.correct.every(i=>Number.isInteger(i)&&i>=0&&i<q.options.length));
}

async function addTest(title,qs){
  const t={sid:S.sid,title,qs,ts:Date.now()};
  if(DB&&UID){
    try{t.ownerUid=UID;t.id=(await DB.collection('tests').add(t)).id;cloudError=''}
    catch(e){cloudError='Cloud save failed; this test is stored on this device only.';delete t.ownerUid;t.id='l'+Date.now()}
  }else t.id='l'+Date.now();
  if(!TESTS.some(x=>x.id===t.id))TESTS.push(t);
  lset('ubt:tests',TESTS);return t.id;
}
async function delTest(id){
  const t=TESTS.find(x=>x.id===id);
  if(DB&&t&&t.id[0]!=='l'&&t.ownerUid!==UID)return;
  if(DB&&t&&t.id[0]!=='l'){
    try{await DB.doc('tests/'+id).delete()}
    catch(e){cloudError='Could not delete the shared test.';setSync();return}
  }
  TESTS=TESTS.filter(t=>t.id!==id);lset('ubt:tests',TESTS);
}

function parse(t){
  if(t.length>500000)throw new Error('Question JSON is too large (maximum 500 KB).');
  let d;
  try{d=JSON.parse(t)}catch(e){
    try{d=JSON.parse(t.replace(/^\s*\/\/.*$/gm,'').replace(/([\]"\d])[ \t]*\/\/[^\n]*/g,'$1').replace(/,\s*([\]}])/g,'$1'))}
    catch(e2){throw new Error('JSON форматы қате, тексеріп қайта енгізіңіз.')}
  }
  if(!Array.isArray(d)||!d.length)throw new Error('JSON — бос емес сұрақтар тізімі [ ... ] болуы керек.');
  if(d.length>300)throw new Error('A test can contain at most 300 questions.');
  return d.map((q,i)=>{
    const n=i+1;
    if(q&&typeof q.question==='string'&&q.question.length>1000)throw new Error('Question text must be at most 1000 characters.');
    if(!q||typeof q.question!=='string'||!q.question.trim())throw new Error(`${n}-сұрақта «question» мәтіні жоқ.`);
    if(!Array.isArray(q.options)||q.options.length<2||q.options.length>L.length)throw new Error(`${n}-сұрақта «options» кемінде 2 жауап нұсқасынан тұруы керек.`);
    if(q.options.some(o=>String(o).length>500))throw new Error('Answer options must be at most 500 characters.');
    const c=Array.isArray(q.correct)?q.correct:[q.correct];
    if(!c.length||c.some(x=>!Number.isInteger(x)||x<0||x>=q.options.length))throw new Error(`${n}-сұрақта «correct» индекстері қате (0-ден ${q.options.length-1}-ге дейін болуы керек).`);
    return{question:q.question,options:q.options.map(String),correct:[...new Set(c)].sort((a,b)=>a-b)};
  });
}

function resultsList(){
  if(!FIREBASE_CONFIGURED)return '<p class="hint">Firebase is not configured; shared results are unavailable.</p>';
  if(!ready)return '<p class="hint">Loading shared results...</p>';
  if(RESULTS_ERROR)return `<p class="hint">${esc(RESULTS_ERROR)}</p>`;
  if(!SHARED_RESULTS.length)return '<p class="hint">No results have been published yet.</p>';
  return SHARED_RESULTS.map(r=>`<div class="board-item"><b>${esc(r.nickname)}</b> - ${esc(r.testTitle)}: ${r.score}/${r.total} (${r.percent}%)<small>${esc((SUBJ.find(s=>s.id===r.sid)||{name:r.sid}).name)}${r.createdAt&&r.createdAt.toDate?' | '+esc(r.createdAt.toDate().toLocaleString('kk-KZ')):''}</small></div>`).join('');
}
function home(){
  app.innerHTML=`<div class="top"><span class="brand">ҰБТ дайындық</span><span class="sync" id="sync"></span></div>
  <h1>ҰБТ-ға дайындық платформасы</h1>
  <p class="lead">Пәнді таңдап, өз сұрақтар базаңды JSON түрінде жүктеңіз де, тестті уақытпен тапсырып, қателермен жұмыс жасаңыз.</p>
  <div class="grid">${SUBJ.map(s=>`<button class="sc" data-s="${s.id}"><span class="ic">${s.ic}</span><b>${s.name}</b><span class="cn">Тесттер: ${TESTS.filter(t=>t.sid===s.id).length}</span><span class="go">Тестке өту</span></button>`).join('')}</div>`;
  app.innerHTML+='<section class="card board"><h2>&#1054;&#1088;&#1090;&#1072;&#1179; &#1085;&#1241;&#1090;&#1080;&#1078;&#1077; &#1090;&#1072;&#1179;&#1090;&#1072;&#1089;&#1099;</h2><div id="results">'+resultsList()+'</div></section>';
}

const list=()=>{const a=TESTS.filter(t=>t.sid===S.sid).sort((x,y)=>x.ts-y.ts);return a.length?a.map(t=>`<div class="tr"><span><b>${esc(t.title)}</b><br><small class="mut">${t.qs.length} &#1089;&#1201;&#1088;&#1072;&#1179;</small></span><span class="acts"><button class="btn sm" data-b="${esc(t.id)}">&#1041;&#1072;&#1089;&#1090;&#1072;&#1091;</button>${!DB||t.id[0]==='l'||t.ownerUid===UID?`<button class="btn ghost sm" data-d="${esc(t.id)}">${armed===t.id?'&#1056;&#1072;&#1089;&#1090;&#1072;&#1091;':'&#1256;&#1096;&#1110;&#1088;&#1091;'}</button>`:''}</span></div>`).join(''):'<p class="hint">No tests yet. Add a title and JSON question list below.</p>'};
const renderList=()=>{const l=$('#list');if(l)l.innerHTML=list()};
function subject(){
  const d=S.draft&&S.draft.sid===S.sid?S.draft:{t:'',j:''};
  app.innerHTML=`<div class="top"><button class="brand" id="home">‹ Басты бет</button><span class="sync" id="sync"></span></div>
  <h1>${sub().name} — Тест жүктеу</h1>
  <p class="lead">Әр тақырыпқа жеке нұсқа қосыңыз: шектеусіз. Қосылған тесттер сақталып тұрады, қайтып кіргенде тізімнен таңдайсыз.</p>
  <div class="card" style="margin-bottom:16px"><h3>Сақталған тесттер</h3><div id="list">${list()}</div></div>
  <div class="card"><h3>Жаңа тақырып қосу</h3>
    <input type="text" id="title" placeholder="Тақырыптың аты, мысалы: Ежелгі дүние" maxlength="120" aria-label="Тақырыптың аты" value="${esc(d.t)}">
    <textarea id="json" spellcheck="false" aria-label="JSON сұрақтар базасы" placeholder='[{"question":"…","options":["…","…"],"correct":[0]}]'>${esc(d.j)}</textarea>
    <div id="msg" role="alert"></div>
    <div class="row"><button class="btn" id="add">Қосу</button><button class="btn ghost" id="addgo">Қосып, бастау</button><button class="btn ghost" id="sample">Үлгі JSON-ды көшіру</button></div>
  </div>`;
}

function test(){
  const Q=QS(),q=Q[S.cur],a=S.ans[S.cur]||[],m=q.correct.length>1,last=S.cur===Q.length-1;
  app.innerHTML=`<div class="top"><span><b>${esc(cur().title)}</b><br><small class="mut">${sub().name}</small></span><span><span class="timer" id="tm" aria-label="Өткен уақыт">${fmt(elapsed())}</span><br><span class="sync" id="sync"></span></span></div>
  <nav class="nav" aria-label="Сұрақтар">${Q.map((_,i)=>`<button class="n${i===S.cur?' cur':''}${(S.ans[i]||[]).length?' done':''}" data-n="${i}" aria-label="${i+1}-сұрақ">${i+1}</button>`).join('')}</nav>
  <section class="card"><p class="cnt">${S.cur+1} / ${Q.length}</p><h2>${esc(q.question)}</h2>
  ${m?'<p class="hint">Бірнеше жауап таңдаңыз.</p>':''}
  ${q.options.map((o,i)=>`<label class="opt${a.includes(i)?' on':''}"><input type="${m?'checkbox':'radio'}" name="o" value="${i}"${a.includes(i)?' checked':''}><span class="k">${L[i]}</span><span>${esc(o)}</span></label>`).join('')}</section>
  <div id="warn"></div>
  <div class="row sp"><button class="btn ghost" id="pv"${S.cur?'':' disabled'}>Алдыңғы сұрақ</button>${last?'<button class="btn" id="fin">Тестті аяқтау</button>':'<button class="btn" id="nx">Келесі сұрақ</button>'}</div>`;
}

function result(){
  const Q=QS(),sc=score(),t=Q.length,p=Math.round(sc/t*100),sec=S.time;
  const publishStatus=!FIREBASE_CONFIGURED?'<p class="hint">Firebase is not configured; public publishing is unavailable.</p>':!ready?'<p class="hint">Connecting to Firebase...</p>':!DB?`<p class="hint">${esc(cloudError||'Cloud publishing is unavailable.')}</p>`:S.published?'<p class="note">&#1053;&#1241;&#1090;&#1080;&#1078;&#1077; &#1086;&#1088;&#1090;&#1072;&#1179; &#1090;&#1072;&#1179;&#1090;&#1072;&#1171;&#1072; &#1078;&#1072;&#1088;&#1080;&#1103;&#1083;&#1072;&#1085;&#1076;&#1099;.</p>':'';
  app.innerHTML=`<div class="top"><span class="brand">${esc(cur().title)}</span></div>
  <h1>Тест нәтижесі</h1>
  <div class="card"><div class="res"><div class="pct">${p}%</div><p class="stat"><b>${sc} / ${t}</b>жинаған балл</p><p class="stat"><b>${Math.floor(sec/60)} мин ${sec%60} сек</b>жұмсалған уақыт</p></div>
  <div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div></div>
  <section class="card" style="margin-top:16px"><h2>&#1053;&#1241;&#1090;&#1080;&#1078;&#1077;&#1085;&#1110; &#1086;&#1088;&#1090;&#1072;&#1179; &#1090;&#1072;&#1179;&#1090;&#1072;&#1171;&#1072; &#1078;&#1072;&#1088;&#1080;&#1103;&#1083;&#1072;&#1091;</h2><p class="hint">&#1053;&#1241;&#1090;&#1080;&#1078;&#1077;&#1187;&#1110;&#1079; &#1083;&#1072;&#1179;&#1072;&#1087; &#1072;&#1090;&#1099;&#1187;&#1099;&#1079;&#1073;&#1077;&#1085; &#1073;&#1072;&#1088;&#1083;&#1099;&#1171;&#1099;&#1085;&#1072; &#1082;&#1257;&#1088;&#1110;&#1085;&#1077;&#1076;&#1110;.</p>
  <input type="text" id="nickname" maxlength="24" autocomplete="nickname" placeholder="&#1051;&#1072;&#1179;&#1072;&#1087; &#1072;&#1090;&#1099;&#1187;&#1099;&#1079;" aria-label="&#1051;&#1072;&#1179;&#1072;&#1087; &#1072;&#1090;&#1099;&#1187;&#1099;&#1079;" value="${esc(lget('ubt:nickname')||'')}">
  <div id="publishmsg" role="status">${publishStatus}</div>
  <button class="btn" id="publish"${!FIREBASE_CONFIGURED||!ready||!DB||S.published?' disabled':''}>&#1054;&#1088;&#1090;&#1072;&#1179; &#1090;&#1072;&#1179;&#1090;&#1072;&#1171;&#1072; &#1078;&#1072;&#1088;&#1080;&#1103;&#1083;&#1072;&#1091;</button></section>
  <div class="row"><button class="btn" id="retry">Қайта тапсыру</button><button class="btn ghost" id="home">Басты бетке оралу</button></div>
  <h2 style="margin-top:36px">Қатемен жұмыс</h2>
  ${Q.map((q,i)=>{
    const a=S.ans[i]||[],ok=same(a,q.correct);
    return `<section class="card rv ${ok?'ok':'bad'}"><p class="cnt">${i+1}-сұрақ</p><h2 style="margin-bottom:8px">${esc(q.question)}</h2>
    <p class="st">${ok?'Дұрыс':a.length?'Қате':'Жауап берілмеген'}</p>
    ${q.options.map((o,j)=>{const c=q.correct.includes(j),w=a.includes(j)&&!c;
      return `<div class="ro${c?' c':w?' w':''}"><span><b>${L[j]}.</b> ${esc(o)}</span><span class="tag">${c?(a.includes(j)?'Дұрыс жауап, сіз таңдадыңыз':'Дұрыс жауап'):w?'Сіздің қате жауабыңыз':''}</span></div>`}).join('')}</section>`}).join('')}
  <div class="row"><button class="btn" id="retry2">Қайта тапсыру</button><button class="btn ghost" id="home2">Басты бетке оралу</button></div>`;
}

function render(){
  if(['test','result'].includes(S.view)&&!cur()){
    if(ready&&(loaded||!DB)){S={view:'home'};save();return render()}
    app.innerHTML='<p class="lead">Жүктелуде…</p>';return;
  }
  ({home,subject,test,result})[S.view]();setSync();window.scrollTo(0,0);
}
function setSync(){const e=$('#sync');if(e)e.textContent=!ready?'':cloudError||(DB?'Shared database connected':'Firebase not configured - saved on this device')}
function refresh(){
  if(S.view==='home')home(),setSync();
  else if(S.view==='subject')renderList();
  else render();
}
function begin(id){S={view:'test',sid:S.sid,tid:id,ans:{},cur:0,t0:Date.now()};save();warned=false;render()}
async function submit(go){
  const ti=$('#title').value.trim(),m=$('#msg');
  if(!ti||ti.length>120){m.innerHTML=err('Enter a title of 1-120 characters.');return}
  let qs;try{qs=parse($('#json').value)}catch(x){m.innerHTML=err(x.message);return}
  const id=await addTest(ti,qs);S.draft=null;
  if(go)return begin(id);
  $('#title').value='';$('#json').value='';save();renderList();
  m.innerHTML=`<div class="note">«${esc(ti)}» сақталды.</div>`;
}

async function publishResult(){
  const input=$('#nickname'),message=$('#publishmsg'),nickname=input.value.trim();
  if(!DB||!UID){message.innerHTML=err('Shared storage is not connected.');return}
  if(nickname.length<2||nickname.length>24||/[\u0000-\u001f\u007f]/.test(nickname)){message.innerHTML=err('Nickname must be 2-24 characters and contain no control characters.');return}
  if(publishing)return;publishing=true;$('#publish').disabled=true;message.textContent='Publishing...';
  const total=QS().length,points=score();
  try{
    await DB.collection('results').add({ownerUid:UID,nickname,testId:S.tid,testTitle:cur().title,sid:S.sid,score:points,total,percent:Math.round(points/total*100),timeSeconds:S.time,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    lset('ubt:nickname',nickname);S.published=true;save();message.innerHTML='<p class="note">&#1053;&#1241;&#1090;&#1080;&#1078;&#1077; &#1086;&#1088;&#1090;&#1072;&#1179; &#1090;&#1072;&#1179;&#1090;&#1072;&#1171;&#1072; &#1078;&#1072;&#1088;&#1080;&#1103;&#1083;&#1072;&#1085;&#1076;&#1099;.</p>';
  }catch(e){cloudError='Result could not be saved to the cloud.';message.innerHTML=err(cloudError);setSync();$('#publish').disabled=false}
  finally{publishing=false}
}

app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.id;
  if(b.dataset.d){
    if(armed===b.dataset.d){delTest(armed);armed=null}else armed=b.dataset.d;
    renderList();return;
  }
  armed=null;
  if(b.dataset.s){S={view:'subject',sid:b.dataset.s};save();render()}
  else if(b.dataset.b)begin(b.dataset.b);
  else if(id==='publish')publishResult();
  else if(id==='home'||id==='home2'){S={view:'home'};save();render()}
  else if(id==='sample'){
    const j=JSON.stringify(SAMPLE,null,2);
    $('#json').value=j;if(!$('#title').value)$('#title').value='Үлгі тақырып';
    S.draft={sid:S.sid,t:$('#title').value,j};save();
    try{navigator.clipboard.writeText(j)}catch(x){}
    $('#msg').innerHTML='<div class="note">Үлгі өріске қойылды.</div>';
  }
  else if(id==='add')submit(false);
  else if(id==='addgo')submit(true);
  else if(b.dataset.n!==undefined){S.cur=+b.dataset.n;save();render()}
  else if(id==='pv'){S.cur--;save();render()}
  else if(id==='nx'){S.cur++;save();render()}
  else if(id==='fin'){
    const left=QS().filter((_,i)=>!(S.ans[i]||[]).length).length;
    if(left&&!warned){warned=true;$('#warn').innerHTML=err(`Жауап берілмеген сұрақтар: ${left}. Аяқтау үшін батырманы қайта басыңыз.`);return}
    S.time=elapsed();S.view='result';save();render();
  }
  else if(id==='retry'||id==='retry2')begin(S.tid);
});

app.addEventListener('input',e=>{
  if(S.view!=='subject'||!['title','json'].includes(e.target.id))return;
  S.draft={sid:S.sid,t:$('#title').value,j:$('#json').value};save();
});

app.addEventListener('change',e=>{
  if(S.view!=='test'||e.target.name!=='o')return;
  const v=[...app.querySelectorAll('input[name=o]')];
  S.ans[S.cur]=v.filter(x=>x.checked).map(x=>+x.value);save();
  v.forEach(x=>x.closest('.opt').classList.toggle('on',x.checked));
  app.querySelector('.n.cur').classList.toggle('done',S.ans[S.cur].length>0);
});

setInterval(()=>{const t=document.getElementById('tm');if(t&&S.view==='test')t.textContent=fmt(elapsed())},1000);
render();
(async()=>{
  if(!FIREBASE_CONFIGURED){ready=true;render();return}
  try{
    if(!window.firebase)throw new Error('Firebase SDK failed to load');
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth();
    const currentUser=await new Promise((resolve,reject)=>{
      const unsubscribe=auth.onAuthStateChanged(user=>{unsubscribe();resolve(user)},error=>{unsubscribe();reject(error)});
    });
    if(!currentUser)await auth.signInAnonymously();
    UID=auth.currentUser.uid;
    DB=firebase.firestore();
    DB.collection('tests').onSnapshot(sn=>{
      const cloudTests=sn.docs.map(d=>({...d.data(),id:d.id})).filter(validTest);
      TESTS=[...cloudTests,...TESTS.filter(t=>t.id[0]==='l')].sort((x,y)=>x.ts-y.ts);
      lset('ubt:tests',TESTS);loaded=true;cloudError='';
      if(S.view==='home'||S.view==='subject'||(['test','result'].includes(S.view)&&!cur()))refresh();
    },e=>{cloudError='Could not load shared tests.';loaded=true;if(S.view==='home'||S.view==='subject')refresh();else setSync()});
    DB.collection('results').orderBy('createdAt','desc').onSnapshot(sn=>{
      SHARED_RESULTS=sn.docs.map(d=>d.data());RESULTS_ERROR='';
      if(S.view==='home')refresh();
    },e=>{RESULTS_ERROR='Could not load shared results.';if(S.view==='home')refresh()});
    ready=true;refresh();
  }catch(e){
    DB=null;UID=null;cloudError='Firebase connection failed. Tests remain on this device.';ready=true;render();
  }
})();
</script>
</body>
</html>
